# Self-hosted deploy on a cheap VPS (~$5/mo): app + Postgres + Caddy (auto-HTTPS).
# One command:  docker compose up -d
# First copy compose.env.example → .env (same folder) and fill it in. See SELFHOST.md.

# Pinned project name: compose otherwise derives it from the FOLDER name, and the
# named volumes below (incl. the production DB) are prefixed with it. The repo was
# renamed InstaContentEngine → ContentEngine; existing deploys keep their volumes
# because this name never changes with the folder.
name: instacontentengine

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: insta
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: insta
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insta"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .                      # uses ./Dockerfile (context = repo root)
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_MODE: cloud
      # Signs login tokens AND encrypts stored user keys — strong & STABLE, never change.
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Email (Resend) — verification + password reset. Empty = emails only logged.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Content Engine <onboarding@resend.dev>}
      REQUIRE_VERIFIED_EMAIL: ${REQUIRE_VERIFIED_EMAIL:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Which build an error came from — the question that decides whether to roll
      # back. Nothing sets it automatically, so deploy with it in front of the
      # command:  APP_RELEASE=$(git rev-parse --short HEAD) docker compose up -d app
      # Unset is fine: monitoring then reports the build as unstamped rather than
      # attaching a stale commit that never shipped.
      APP_RELEASE: ${APP_RELEASE:-}
      DATABASE_URL: postgresql+asyncpg://insta:${DB_PASSWORD}@db:5432/insta
      # The PLATFORM's own OpenRouter key — not a tenant's. Everyone brings their
      # own key for their own work; this one pays for the three things the product
      # gives away before anybody has a key: the onboarding post, the five free
      # generations, and the landing page that writes a post for a visitor.
      # Leave it empty and all three answer 503 instead of failing mid-run, which
      # is what this deployment has been doing since those phases shipped.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # …or a direct vendor key, if that is where the platform's own account is.
      # Which of these is actually spent is decided by DEFAULT_*_PROVIDER below,
      # not by which one happens to be filled: the app looks up the key field for
      # the configured vendor and ignores the rest.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # Stock photography for the giveaway. Cheaper than generating a picture —
      # Pexels is free — and the code prefers it whenever one of these is set,
      # falling back to AI generation only when neither is.
      #
      # These were missing from this list entirely, which is a silent failure
      # rather than a loud one: the key sits in .env looking configured, never
      # reaches the process, and every free generation dies in "Generation
      # failed" because the stock client was built holding nothing.
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      # The ceiling on that giveaway, in dollars per day, counted across every
      # anonymous and free generation. Worst case is roughly $1.5 per registered
      # account (5 generations x up to 10 AI images), so $10 is about seven such
      # accounts a day. Not transactional: concurrent requests can overshoot by
      # one generation each.
      APP_DAILY_SPEND_USD: ${APP_DAILY_SPEND_USD:-10}
      # Overridable, because on the platform key these are the models WE pay for.
      # The defaults below are what this deployment has always run; config.py's
      # own defaults are newer, and moving to them is a spending decision rather
      # than an upgrade, so it is made here rather than inherited silently.
      #
      # Provider and model travel together: a model id belongs to exactly one
      # vendor, so changing one without the other asks OpenRouter for an OpenAI
      # id or the reverse, and the failure arrives as an unhelpful 400 from a
      # third party rather than as a configuration error.
      DEFAULT_TEXT_PROVIDER: ${DEFAULT_TEXT_PROVIDER:-openrouter}
      DEFAULT_IMAGE_PROVIDER: ${DEFAULT_IMAGE_PROVIDER:-openrouter}
      DEFAULT_TEXT_MODEL: ${DEFAULT_TEXT_MODEL:-anthropic/claude-sonnet-4}
      DEFAULT_IMAGE_MODEL: ${DEFAULT_IMAGE_MODEL:-google/gemini-2.5-flash-image-preview}
      PORT: "8000"
    volumes:
      - uploads:/app/uploads      # generated slides / raw images / reel mp4s
    expose:
      - "8000"

  # Daily Postgres dumps → the `backups` volume, pruned to BACKUP_KEEP_DAYS.
  # Reuses the postgres image (already pulled) so there's no extra dependency.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - backups:/backups
      - uploads:/uploads:ro          # so the daily backup also archives generated media
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      # Hostnames that redirect to DOMAIN — www, and an old address kept alive
      # during a move. Comma-separated. Unset is a safe no-op (see Caddyfile).
      ALIAS_DOMAINS: ${ALIAS_DOMAINS:-www.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # Let's Encrypt certificates (persisted)
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  backups:
  caddy_data:
  caddy_config:
