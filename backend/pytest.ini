[pytest]
asyncio_mode = auto
testpaths = tests
# The browser tests run in their own pytest process, and must: Playwright's sync
# API keeps an event loop alive on the main thread for the whole session, after
# which every asyncio.run() in the rest of the suite raises "cannot be called
# from a running event loop". Run them with:  pytest -m e2e
addopts = -m "not e2e"
markers =
    e2e: drives the SPA in a real browser (needs playwright + a chromium build)
